[package]
name = "blvm-zmq"
version = "0.1.6"
edition = "2024"
rust-version = "1.91"
authors = ["Bitcoin Commons Team"]
description = "ZeroMQ PUB notifications module for blvm-node (hashblock, hashtx, rawblock, rawtx, sequence)"
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-zmq"
homepage = "https://btcdecoded.org"
keywords = ["bitcoin", "zmq", "zeromq", "module"]
categories = ["cryptography::cryptocurrencies"]

[[bin]]
name = "blvm-zmq"
path = "src/main.rs"

[lib]
name = "blvm_zmq"
path = "src/lib.rs"

[dependencies]
# Keep the IPC message types aligned with the supported BLVM node release.
blvm-node = { version = "=0.1.104", default-features = false }
blvm-sdk = { version = "=0.1.27", default-features = false, features = ["node"] }
blvm-sdk-macros = "=0.1.27"
blvm-protocol = "=0.1.55"

tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=0.8.2"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zeromq = { package = "zmq", version = "=0.10" }
