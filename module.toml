name = "blvm-zmq"
version = "0.1.7"
entry_point = "blvm-zmq"

description = "Bitcoin-compatible ZMQ PUB notifications: hashblock, hashtx, rawblock, rawtx, sequence"
author = "Bitcoin Commons Team"

capabilities = [
    "read_blockchain",
    "read_mempool",
    "subscribe_events",
]

[config_defaults]
endpoint = "tcp://127.0.0.1:28332"

[config_schema]
endpoint = "one PUB socket for hashblock, hashtx, rawblock, rawtx, and sequence"
hashblock = "optional; bind the hashblock topic on its own address, or \"\" to turn it off"
hashtx = "optional; bind the hashtx topic on its own address, or \"\" to turn it off"
rawblock = "optional; bind the rawblock topic on its own address, or \"\" to turn it off"
rawtx = "optional; bind the rawtx topic on its own address, or \"\" to turn it off"
sequence = "optional; bind the sequence topic on its own address, or \"\" to turn it off"

